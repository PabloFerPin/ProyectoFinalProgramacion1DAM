<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Nuevo Videojuego</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container mt-4" style="max-width: 1150px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">🎮 Nuevo Videojuego</h1>
        <button class="btn btn-outline-secondary" onclick="window.location.href = 'index.html'">
            <i class="bi bi-arrow-left"></i> Volver
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form id="form-videojuego">
                <div class="mb-3">
                    <label class="form-label fw-bold">Título</label>
                    <input type="text" id="titulo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Desarrolladora</label>
                    <input type="text" id="desarrolladora" class="form-control" required>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label fw-bold">Fecha de salida</label>
                        <input type="date" id="fechaSalida" class="form-control" required>
                    </div>
                    <div class="col">
                        <label class="form-label fw-bold">Horas jugadas</label>
                        <input type="number" id="horasJugadas" class="form-control" step="0.1" required>
                    </div>
                    <div class="col-auto d-flex align-items-end mb-1">
                        <div class="form-check">
                            <input type="checkbox" id="completado" class="form-check-input">
                            <label class="form-check-label fw-bold">Completado</label>
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Géneros</label>
                    <div id="generos" class="d-flex flex-wrap gap-2"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Plataformas</label>
                    <div id="plataformas" class="d-flex flex-wrap gap-2"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-floppy"></i> Guardar
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="nuevoVideojuego.js"></script>
</body>
</html>
