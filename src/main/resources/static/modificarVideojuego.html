<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Modificar Videojuego</h1>

<form id="form-videojuego">
    <label>Título: <input type="text" id="titulo" required></label><br><br>
    <label>Desarrolladora: <input type="text" id="desarrolladora" required></label><br><br>
    <label>Fecha de salida: <input type="date" id="fechaSalida" required></label><br><br>
    <label>Horas jugadas: <input type="number" id="horasJugadas" step="0.1" required></label><br><br>
    <label>Completado: <input type="checkbox" id="completado"></label><br><br>

    <label>Géneros:</label><br>
    <div id="generos"></div><br>

    <label>Plataformas:</label><br>
    <div id="plataformas"></div><br>

    <button type="submit">Guardar</button>
</form>

<br>
<button onclick = "window.location.href  = `index.html`">Volver al listado</button>

<script src="modificarVideojuego.js"></script>
</body>
</html>
