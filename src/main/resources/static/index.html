<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Biblioteca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">

<div class="container-xxl mt-4" style="max-width: 85%;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">🎮 Mi biblioteca de videojuegos</h1>
        <div class="d-flex gap-2 align-items-center">
            <button class="btn btn-primary" onclick="window.location.href = 'nuevoVideojuego.html'">
                <i class="bi bi-plus-lg"></i> Crear videojuego
            </button>
            <button class="btn btn-secondary" onclick="exportarCsv()">
                <i class="bi bi-download"></i> Exportar CSV
            </button>
            <label class="btn btn-success mb-0">
                <i class="bi bi-upload"></i> Importar CSV
                <input type="file" id="archivoCsv" accept=".csv" style="display:none" onchange="importarCsv()">
            </label>
        </div>
    </div>

    <table class="table table-bordered table-hover table-striped text-center">
        <thead class="table-dark">
        <tr>
        <tr>
            <th>Nombre</th>
            <th>Desarrolladora</th>
            <th>Fecha de salida</th>
            <th>Horas jugadas</th>
            <th>Completado</th>
            <th>Géneros</th>
            <th>Plataformas</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>
        </thead>
        <tbody id="cuerpoDeLaTabla"></tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="main.js"></script>
</body>

</html>
